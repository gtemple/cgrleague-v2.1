<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Saira', sans-serif; background: #ecebe5; }
  a { color: inherit; text-decoration: none; }
  input { font-family: 'Saira', sans-serif; outline: none; }
</style>
</helmet>

<div style="background:#ecebe5; min-height:100vh; color:#16140f;">

  <!-- nav -->
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:6px; min-height:62px; padding:8px 26px; background:#16140f; border-bottom:3px solid #e8232c; position:sticky; top:0; z-index:20;">
    <a href="CGR%20Home.dc.html" style="display:flex; align-items:center; gap:11px;">
      <div style="width:32px; height:32px; border-radius:4px; background:#e8232c; display:flex; align-items:center; justify-content:center; font-family:'Saira Condensed',sans-serif; font-weight:800; font-size:15px; color:#fff;">CGR</div>
      <div style="font-family:'Saira Condensed',sans-serif; font-weight:700; font-size:19px; color:#f7f5ef;">CGR LEAGUE</div>
    </a>
    <div style="display:flex; align-items:center; gap:14px 26px; flex-wrap:wrap; font-family:'Saira',sans-serif; font-weight:500; font-size:14px; color:#b3afa4;">
      <a href="CGR%20Seasons.dc.html" style="transition:color 0.15s;" style-hover="color:#f7f5ef;">Seasons</a>
      <a href="CGR%20Drivers.dc.html" style="transition:color 0.15s;" style-hover="color:#f7f5ef;">Drivers</a>
      <a href="CGR%20Teams.dc.html" style="transition:color 0.15s;" style-hover="color:#f7f5ef;">Teams</a>
      <span style="color:#fff; border-bottom:2px solid #e8232c; padding-bottom:3px;">Tracks</span>
      <a href="CGR%20Hall%20of%20Fame.dc.html" style="transition:color 0.15s;" style-hover="color:#f7f5ef;">Hall of Fame</a><a href="CGR%20Articles.dc.html" style="transition:color 0.15s;" style-hover="color:#f7f5ef;">Articles</a>
    </div>
    <div style="display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:#8a8579; border:1px solid rgba(255,255,255,0.18); border-radius:5px; padding:7px 11px;">⌕ SEARCH <span style="color:#5a564c;">⌘K</span></div>
  </div>

  <!-- header band -->
  <div style="background:#16140f; padding:26px;">
    <div style="max-width:1440px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      <div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.22em; color:#8a8579; margin-bottom:6px;">CGR LEAGUE · CIRCUITS</div>
        <div style="font-family:'Saira Condensed',sans-serif; font-weight:800; font-size:clamp(36px,6vw,54px); line-height:0.9; color:#f7f5ef; text-transform:uppercase; letter-spacing:-0.01em;">Tracks</div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:#fff; background:#e8232c; border:1px solid #e8232c; border-radius:4px; padding:8px 12px;">27 TRACKS</div>
    </div>
  </div>

  <div style="max-width:1440px; margin:0 auto; padding:22px 26px 60px;">

    <!-- all-time records -->
    <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:#7a766b; margin-bottom:13px;">ALL-TIME RECORDS</div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-bottom:30px;">
      <sc-for list="{{ records }}" as="r" hint-placeholder-count="2">
        <div style="background:#fff; border:1px solid #d9d6cd; border-radius:5px; padding:20px 22px; display:flex; align-items:center; justify-content:space-between; gap:18px;">
          <div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#e8232c; font-weight:700;">{{ r.label }}</div>
            <div style="font-family:'Saira Condensed',sans-serif; font-weight:800; font-size:46px; color:#16140f; line-height:1; margin:8px 0;">{{ r.value }}</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; color:#5a564c; border:1px solid #e2dfd6; border-radius:3px; padding:2px 5px;">{{ r.nat }}</span>
              <span style="font-family:'Saira',sans-serif; font-size:14px; font-weight:600; color:#5a564c;">{{ r.track }}</span>
            </div>
          </div>
          <div style="width:150px; height:88px; border-radius:5px; background:repeating-linear-gradient(118deg,#e1ded4 0 2px,#edeae1 2px 10px); flex:none; display:flex; align-items:flex-end; justify-content:flex-end; padding:6px; font-family:'JetBrains Mono',monospace; font-size:8px; color:#b0ada2;">CIRCUIT</div>
        </div>
      </sc-for>
    </div>

    <!-- all tracks -->
    <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;">
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:#7a766b;">ALL TRACKS</span>
      <input value="{{ q }}" onInput="{{ onSearch }}" placeholder="Search tracks..." style="font-size:13px; color:#16140f; background:#fff; border:1px solid #d9d6cd; border-radius:5px; padding:8px 13px; width:220px;"/>
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;">
      <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="27">
        <a href="CGR%20Track.dc.html" style-hover="border-color:#a8a496; transform:translateY(-2px); box-shadow:0 10px 22px rgba(22,20,15,0.09);" style="transition:border-color 0.15s, transform 0.15s, box-shadow 0.15s; background:#fff; border:1px solid #d9d6cd; border-radius:5px; padding:12px; cursor:pointer; display:flex; align-items:center; gap:12px; text-decoration:none;">
          <div style="width:50px; height:50px; border-radius:5px; background:repeating-linear-gradient(118deg,#e1ded4 0 2px,#edeae1 2px 9px); flex:none;"></div>
          <div style="min-width:0;">
            <div style="font-family:'Saira Condensed',sans-serif; font-weight:700; font-size:16px; color:#16140f; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ t.name }}</div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
              <span style="font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:700; color:#5a564c; border:1px solid #e2dfd6; border-radius:3px; padding:1px 3px; flex:none;">{{ t.nat }}</span>
              <span style="font-family:'Saira',sans-serif; font-size:11px; color:#9b988d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ t.loc }}</span>
            </div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.04em; color:{{ t.racesColor }}; margin-top:6px;">{{ t.racesLabel }}</div>
          </div>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="padding:40px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:#b0ada2;">NO TRACKS MATCH “{{ q }}”</div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: '' };

  records = [
    { label: 'MOST RACES HELD', value: '7', track: 'Abu Dhabi Grand Prix', nat: 'UAE' },
    { label: 'MOST LAPS DRIVEN', value: '2,249', track: 'French Grand Prix', nat: 'FRA' },
  ];

  tracksRaw = [
    { name: 'Abu Dhabi Grand Prix', loc: 'Abu Dhabi, UAE', nat: 'UAE', races: 7 },
    { name: 'Austrian Grand Prix', loc: 'Spielberg, Austria', nat: 'AUT', races: 7 },
    { name: 'Azerbaijan Grand Prix', loc: 'Baku, Azerbaijan', nat: 'AZE', races: 7 },
    { name: 'Bahrain Grand Prix', loc: 'Sakhir, Bahrain', nat: 'BHR', races: 7 },
    { name: 'Belgian Grand Prix', loc: 'Spa, Belgium', nat: 'BEL', races: 7 },
    { name: 'Dutch Grand Prix', loc: 'Zandvoort, Netherlands', nat: 'NED', races: 7 },
    { name: 'Emilia Romagna Grand Prix', loc: 'Imola, Italy', nat: 'ITA', races: 7 },
    { name: 'Sao Paolo Grand Prix', loc: 'Sao Paolo, Brazil', nat: 'BRA', races: 7 },
    { name: 'French Grand Prix', loc: 'Le Mans, France', nat: 'FRA', races: 6 },
    { name: 'Italian Grand Prix', loc: 'Monza, Italy', nat: 'ITA', races: 6 },
    { name: 'Portuguese Grand Prix', loc: 'Portimão, Portugal', nat: 'POR', races: 6 },
    { name: 'United States Grand Prix', loc: 'Austin, United States', nat: 'USA', races: 6 },
    { name: 'British Grand Prix', loc: 'Silverstone, United Kingdom', nat: 'GBR', races: 5 },
    { name: 'Canadian Grand Prix', loc: 'Montreal, Canada', nat: 'CAN', races: 5 },
    { name: 'Chinese Grand Prix', loc: 'Shanghai, China', nat: 'CHN', races: 5 },
    { name: 'Hungarian Grand Prix', loc: 'Mogyoród, Hungary', nat: 'HUN', races: 5 },
    { name: 'Spanish Grand Prix', loc: 'Barcelona, Spain', nat: 'ESP', races: 5 },
    { name: 'Russian Grand Prix', loc: 'Sochi, Russia', nat: 'RUS', races: 4 },
    { name: 'Miami Grand Prix', loc: 'Miami, United States', nat: 'USA', races: 3 },
    { name: 'Saudi Arabian Grand Prix', loc: 'Jeddah, Saudi Arabia', nat: 'SAU', races: 3 },
    { name: 'Australian Grand Prix', loc: 'Melbourne, Australia', nat: 'AUS', races: 2 },
    { name: 'Japanese Grand Prix', loc: 'Suzuka, Japan', nat: 'JPN', races: 1 },
    { name: 'Las Vegas Grand Prix', loc: 'Las Vegas, United States', nat: 'USA', races: 1 },
    { name: 'Mexico City Grand Prix', loc: 'Mexico City, Mexico', nat: 'MEX', races: 0 },
    { name: 'Monaco Grand Prix', loc: 'Monte Carlo, Monaco', nat: 'MON', races: 0 },
    { name: 'Qatar Grand Prix', loc: 'Lusail, Qatar', nat: 'QAT', races: 0 },
    { name: 'Singapore Grand Prix', loc: 'Marina Bay, Singapore', nat: 'SGP', races: 0 },
  ];

  renderVals() {
    const q = this.state.q.trim().toLowerCase();
    let tracks = this.tracksRaw.slice();
    if (q) tracks = tracks.filter(t => (t.name + ' ' + t.loc).toLowerCase().includes(q));
    tracks = tracks.map(t => ({
      ...t,
      racesLabel: t.races > 0 ? (t.races + (t.races === 1 ? ' RACE' : ' RACES')) : 'UPCOMING',
      racesColor: t.races > 0 ? '#e8232c' : '#b0ada2',
    }));
    return { records: this.records, tracks, q: this.state.q, empty: tracks.length === 0, onSearch: e => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
