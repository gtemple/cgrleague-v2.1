services:
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8002
    volumes:
      - ./backend:/app
    ports:
      - "8002:8002"
    env_file: .env

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8002
    depends_on:
      - backend
